
services:
  db:
    image: postgres:17
    container_name: stationery_store_db
    restart: unless-stopped

    environment:
      POSTGRES_DB: stationery_store
      POSTGRES_USER: stationery_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5432:5432"

    volumes:
      - stationery_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stationery_app -d stationery_store"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  stationery_postgres_data:
